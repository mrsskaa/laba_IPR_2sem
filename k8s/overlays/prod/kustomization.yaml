apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: messager-prod

resources:
  - ../../base
  - s3-pv.yaml

labels:
  - pairs:
      environment: prod
    includeSelectors: false

patches:
  - path: patches/ingress-host.yaml
  - path: patches/replicas.yaml
  - path: patches/message-uploads-pvc.yaml
  - path: patches/configmap-bucket.yaml
  - path: patches/resources.yaml

images:
  - name: mablinov2704/frontend
    newTag: v1.0.0
  - name: mablinov2704/bff
    newTag: v1.0.0
  - name: mablinov2704/user-service
    newTag: v1.0.0
  - name: mablinov2704/message-service
    newTag: v1.0.0
